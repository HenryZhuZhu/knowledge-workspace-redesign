<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>知识工作台 · Redesign Demo</title>
<style>
  /* ============================================================
     设计系统 (Design Tokens)
     —— 收敛为「1 主色 + 语义色」+ 8px 栅格 + 统一字阶
  ============================================================ */
  :root {
    /* 主色：品牌 / 操作 */
    --brand-50:#eef4ff; --brand-100:#dbe7ff; --brand-300:#9bb9ff;
    --brand-500:#3b6cf6; --brand-600:#2f59d6; --brand-700:#264bb5;
    /* 中性灰阶 */
    --gray-0:#ffffff; --gray-25:#fbfcfe; --gray-50:#f5f7fa; --gray-100:#eef1f6;
    --gray-200:#e3e8ef; --gray-300:#cbd2dd; --gray-400:#9aa4b2;
    --gray-500:#697586; --gray-600:#4b5565; --gray-700:#364152;
    --gray-800:#202939; --gray-900:#121926;
    /* 语义色：仅用于状态 */
    --success:#16a34a; --success-bg:#e7f6ec;
    --warning:#d97706; --warning-bg:#fdf0e3;
    --danger:#dc2626;  --danger-bg:#fdeaea;
    --info:#3b6cf6;    --info-bg:#eaf0ff;
    /* 语义变量 */
    --bg:var(--gray-50); --surface:var(--gray-0); --border:var(--gray-200);
    --text:var(--gray-800); --text-soft:var(--gray-500); --text-mute:var(--gray-400);
    /* 字阶 */
    --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px;
    --fs-lg:16px; --fs-xl:20px; --fs-2xl:26px;
    /* 圆角 / 阴影 / 间距 */
    --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
    --shadow-xs:0 1px 2px rgba(16,24,40,.05);
    --shadow-sm:0 2px 6px rgba(16,24,40,.06);
    --shadow-md:0 6px 18px rgba(16,24,40,.10);
    --nav-w:236px; --nav-w-collapsed:68px; --right-w:312px;
  }
  /* 暗色主题 */
  body.dark {
    --bg:#0e1320; --surface:#161d2e; --border:#26304a;
    --text:#e7ecf5; --text-soft:#9aa6bd; --text-mute:#6b7689;
    --gray-50:#0e1320; --gray-100:#1b2333; --gray-200:#26304a;
    --gray-300:#3a465f; --gray-600:#b5c0d4;
    --brand-50:#16203a; --brand-100:#1d2a4d; --brand-600:#7da2ff;
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:var(--fs-base);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  ::selection { background:var(--brand-100); }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--gray-300); border-radius:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  .icon { width:18px; height:18px; stroke-width:1.8; flex:none; }

  /* ============================================================ 布局骨架 */
  .app { display:grid; grid-template-columns:var(--nav-w) 1fr var(--right-w); height:100vh; transition:grid-template-columns .25s ease; }
  .app.nav-collapsed { grid-template-columns:var(--nav-w-collapsed) 1fr var(--right-w); }
  .app.right-hidden  { grid-template-columns:var(--nav-w) 1fr 0; }
  .app.nav-collapsed.right-hidden { grid-template-columns:var(--nav-w-collapsed) 1fr 0; }

  /* ============================================================ 左侧导航 */
  .nav { background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .nav-top { display:flex; align-items:center; gap:10px; padding:16px 16px 12px; }
  .logo { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--brand-500),var(--brand-700)); display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px; flex:none; }
  .logo-text { font-weight:650; font-size:var(--fs-lg); white-space:nowrap; }
  .nav-collapsed .logo-text, .nav-collapsed .nav-group-label, .nav-collapsed .nav-item span, .nav-collapsed .nav-foot-name { display:none; }

  .nav-scroll { flex:1; overflow-y:auto; padding:6px 12px; }
  .nav-group-label { font-size:var(--fs-xs); color:var(--text-mute); font-weight:600; letter-spacing:.04em; padding:14px 10px 6px; text-transform:uppercase; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:var(--r-sm); color:var(--text-soft); font-size:var(--fs-md); font-weight:500; white-space:nowrap; position:relative; transition:.15s; }
  .nav-item:hover { background:var(--gray-100); color:var(--text); }
  .nav-item.active { background:var(--brand-50); color:var(--brand-600); font-weight:600; }
  .nav-item.active::before { content:""; position:absolute; left:-12px; top:50%; transform:translateY(-50%); width:3px; height:18px; border-radius:3px; background:var(--brand-500); }
  .nav-item .badge { margin-left:auto; background:var(--danger); color:#fff; font-size:10px; min-width:17px; height:17px; border-radius:9px; display:grid; place-items:center; padding:0 5px; font-weight:600; }
  .nav-collapsed .nav-item { justify-content:center; padding:9px 0; }
  .nav-collapsed .nav-item .badge { position:absolute; top:3px; right:8px; margin:0; }

  .nav-foot { border-top:1px solid var(--border); padding:10px 12px; }
  .nav-foot-user { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:var(--r-sm); }
  .nav-foot-user:hover { background:var(--gray-100); }
  .avatar { border-radius:50%; background:var(--brand-100); color:var(--brand-600); display:grid; place-items:center; font-weight:600; flex:none; }
  .nav-foot-name { font-size:var(--fs-md); font-weight:600; white-space:nowrap; }
  .nav-foot-name small { display:block; color:var(--text-mute); font-weight:400; font-size:var(--fs-xs); }

  /* ============================================================ 主区 */
  .main { display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }

  /* 顶栏 */
  .topbar { display:flex; align-items:center; gap:14px; padding:14px 26px; background:var(--surface); border-bottom:1px solid var(--border); }
  .icon-btn { width:34px; height:34px; border-radius:var(--r-sm); display:grid; place-items:center; color:var(--text-soft); transition:.15s; }
  .icon-btn:hover { background:var(--gray-100); color:var(--text); }
  .search { flex:1; max-width:480px; position:relative; }
  .search input { width:100%; height:38px; border:1px solid var(--border); border-radius:var(--r-md); background:var(--gray-50); padding:0 14px 0 40px; font-size:var(--fs-base); color:var(--text); transition:.15s; }
  .search input:focus { outline:none; border-color:var(--brand-300); background:var(--surface); box-shadow:0 0 0 3px var(--brand-50); }
  .search .s-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-mute); }
  .search kbd { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:var(--fs-xs); color:var(--text-mute); background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-family:inherit; }
  .spacer { flex:1; }
  .btn-primary { display:flex; align-items:center; gap:7px; height:38px; padding:0 16px; border-radius:var(--r-md); background:var(--brand-500); color:#fff; font-weight:600; font-size:var(--fs-md); box-shadow:var(--shadow-sm); transition:.15s; }
  .btn-primary:hover { background:var(--brand-600); transform:translateY(-1px); box-shadow:var(--shadow-md); }

  /* 内容滚动区 */
  .scroll { flex:1; overflow-y:auto; padding:24px 26px 40px; }

  /* 问候 / 工作台头部 */
  .hello { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  .hello h1 { font-size:var(--fs-2xl); font-weight:700; letter-spacing:-.01em; }
  .hello h1 .wave { display:inline-block; }
  .hello p { color:var(--text-soft); font-size:var(--fs-md); margin-top:4px; }
  .stat-row { display:flex; gap:8px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:8px 14px; min-width:84px; }
  .stat b { font-size:var(--fs-lg); font-weight:700; }
  .stat span { display:block; font-size:var(--fs-xs); color:var(--text-mute); }

  /* 内容区工具条 */
  .toolbar { display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs { display:flex; gap:4px; background:var(--gray-100); padding:4px; border-radius:var(--r-md); }
  .tab { padding:6px 14px; border-radius:7px; font-size:var(--fs-md); font-weight:600; color:var(--text-soft); transition:.15s; }
  .tab.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-xs); }
  .chips { display:flex; gap:7px; flex-wrap:wrap; }
  .chip { padding:5px 12px; border:1px solid var(--border); border-radius:99px; font-size:var(--fs-sm); color:var(--text-soft); background:var(--surface); transition:.15s; }
  .chip:hover { border-color:var(--brand-300); color:var(--brand-600); }
  .chip.active { background:var(--brand-500); border-color:var(--brand-500); color:#fff; }
  .view-toggle { margin-left:auto; display:flex; gap:2px; background:var(--gray-100); padding:3px; border-radius:8px; }
  .view-toggle button { width:30px; height:28px; border-radius:6px; display:grid; place-items:center; color:var(--text-soft); }
  .view-toggle button.active { background:var(--surface); color:var(--brand-600); box-shadow:var(--shadow-xs); }

  /* ③ 文档卡片 —— 网格 */
  .docs { display:grid; gap:14px; }
  .docs.grid { grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); }
  .docs.list { grid-template-columns:1fr; }
  .doc { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; transition:.18s; cursor:pointer; display:flex; flex-direction:column; }
  .doc:hover { border-color:var(--brand-300); box-shadow:var(--shadow-md); transform:translateY(-3px); }
  .doc-cover { height:104px; position:relative; display:grid; place-items:center; overflow:hidden; }
  .doc-cover .glyph { font-size:30px; opacity:.9; }
  .doc-type { position:absolute; top:10px; left:10px; font-size:var(--fs-xs); font-weight:600; padding:2px 9px; border-radius:99px; background:rgba(255,255,255,.92); color:var(--gray-700); backdrop-filter:blur(4px); }
  .doc-body { padding:13px 14px 12px; flex:1; display:flex; flex-direction:column; gap:8px; }
  .doc-title { font-size:var(--fs-base); font-weight:600; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .doc-desc { font-size:var(--fs-sm); color:var(--text-soft); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .doc-meta { display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:4px; font-size:var(--fs-xs); color:var(--text-mute); }
  .doc-meta .who { display:flex; align-items:center; gap:6px; }
  .doc-meta .who .avatar { width:20px; height:20px; font-size:10px; }
  .doc-meta .m-r { margin-left:auto; display:flex; gap:10px; }
  .doc-meta .m-r span { display:flex; align-items:center; gap:3px; }
  /* 列表态 */
  .docs.list .doc { flex-direction:row; align-items:center; }
  .docs.list .doc-cover { width:120px; height:74px; flex:none; }
  .docs.list .doc-body { padding:12px 16px; }
  .docs.list .doc-desc { -webkit-line-clamp:1; }

  .empty { text-align:center; padding:60px 0; color:var(--text-mute); }
  .empty .glyph { font-size:42px; opacity:.5; }
  .empty p { margin-top:10px; font-size:var(--fs-md); }

  /* —— v2：个性化工作台区块 —— */
  .sec { margin-bottom:26px; }
  .sec-head { display:flex; align-items:center; gap:10px; margin:0 0 14px; flex-wrap:wrap; }
  .sec-head h2 { font-size:var(--fs-lg); font-weight:650; display:flex; align-items:center; gap:7px; }
  .sec-head .count { font-size:var(--fs-sm); color:var(--text-mute); }
  .sec-head .more { margin-left:auto; font-size:var(--fs-sm); color:var(--brand-600); font-weight:600; cursor:pointer; }
  .sec-head .more:hover { text-decoration:underline; }

  /* 继续编辑 横排 */
  .resume-row { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(214px,1fr); gap:12px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity; }
  .resume { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:14px; transition:.18s; cursor:pointer; display:flex; flex-direction:column; gap:11px; scroll-snap-align:start; }
  .resume:hover { border-color:var(--brand-300); box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .resume .r-ico { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font-size:17px; flex:none; }
  .resume .r-title { font-size:var(--fs-base); font-weight:600; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:39px; }
  .resume .r-foot { display:flex; align-items:center; gap:5px; font-size:var(--fs-xs); color:var(--text-mute); margin-top:auto; }
  .resume .r-foot b { color:var(--brand-600); font-weight:600; }
  .resume .r-btn { height:32px; border:1px solid var(--border); border-radius:8px; font-size:var(--fs-sm); font-weight:600; color:var(--text-soft); display:flex; align-items:center; justify-content:center; gap:6px; transition:.15s; }
  .resume:hover .r-btn { border-color:var(--brand-300); color:var(--brand-600); background:var(--brand-50); }

  /* Pin 按钮（卡片封面上） */
  .doc-cover .pin { position:absolute; top:8px; right:8px; width:27px; height:27px; border-radius:7px; background:rgba(255,255,255,.9); display:grid; place-items:center; color:var(--gray-400); opacity:0; transition:.15s; backdrop-filter:blur(4px); border:1px solid transparent; }
  .doc:hover .pin { opacity:1; }
  .doc-cover .pin:hover { color:var(--warning); border-color:var(--border); }
  .doc-cover .pin.on { opacity:1; color:var(--warning); background:var(--warning-bg); }
  .sec-pinned .doc { border-color:var(--brand-100); }

  /* ============================================================ 右侧栏 */
  .right { background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .right-head { display:flex; gap:4px; padding:16px 18px 10px; }
  .right-tab { flex:1; padding:8px; border-radius:8px; font-size:var(--fs-md); font-weight:600; color:var(--text-soft); display:flex; align-items:center; justify-content:center; gap:6px; transition:.15s; }
  .right-tab .cnt { font-size:10px; background:var(--gray-200); color:var(--gray-600); border-radius:99px; padding:0 6px; height:16px; display:grid; place-items:center; }
  .right-tab.active { background:var(--brand-50); color:var(--brand-600); }
  .right-tab.active .cnt { background:var(--brand-500); color:#fff; }
  .right-scroll { flex:1; overflow-y:auto; padding:6px 14px 18px; }

  /* ⑤ 任务卡 */
  .task { border:1px solid var(--border); border-radius:var(--r-md); padding:12px 13px; margin-bottom:10px; transition:.15s; cursor:pointer; background:var(--surface); }
  .task:hover { border-color:var(--brand-300); box-shadow:var(--shadow-sm); }
  .task-top { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .badge-status { font-size:var(--fs-xs); font-weight:600; padding:2px 8px; border-radius:99px; display:inline-flex; align-items:center; gap:4px; }
  .badge-status .dot { width:6px; height:6px; border-radius:50%; }
  .st-todo  { background:var(--info-bg); color:var(--info); }     .st-todo .dot{background:var(--info);}
  .st-doing { background:var(--warning-bg); color:var(--warning); } .st-doing .dot{background:var(--warning);}
  .st-done  { background:var(--success-bg); color:var(--success); } .st-done .dot{background:var(--success);}
  .st-alert { background:var(--danger-bg); color:var(--danger); }   .st-alert .dot{background:var(--danger);}
  .task-id { margin-left:auto; font-size:var(--fs-xs); color:var(--text-mute); font-variant-numeric:tabular-nums; }
  .task-title { font-size:var(--fs-md); font-weight:600; line-height:1.45; margin-bottom:9px; }
  .task-foot { display:flex; align-items:center; gap:8px; font-size:var(--fs-xs); color:var(--text-mute); }
  .task-foot .avatar { width:22px; height:22px; font-size:10px; }
  .task-foot .due { margin-left:auto; display:flex; align-items:center; gap:4px; }
  .task-foot .due.soon { color:var(--danger); font-weight:600; }

  /* 主题切换浮层提示 */
  .float-tip { position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--gray-900); color:#fff; font-size:var(--fs-sm); padding:9px 16px; border-radius:99px; box-shadow:var(--shadow-md); opacity:0; pointer-events:none; transition:.25s; z-index:50; }
  .float-tip.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:1100px){ .app,.app.nav-collapsed{ grid-template-columns:var(--nav-w-collapsed) 1fr 0; } }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ░░░░░░░░░░ 左侧导航 ░░░░░░░░░░ -->
  <aside class="nav">
    <div class="nav-top">
      <div class="logo">知</div>
      <div class="logo-text">知识工作台</div>
    </div>
    <div class="nav-scroll">
      <div class="nav-group-label">工作台</div>
      <a class="nav-item active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg><span>首页</span></a>
      <a class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><span>发现</span></a>
      <a class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v12H7l-3 3z"/></svg><span>消息</span><i class="badge">5</i></a>

      <div class="nav-group-label">空间</div>
      <a class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg><span>知识库</span></a>
      <a class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>项目</span></a>
      <a class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg><span>应用中心</span></a>
      <a class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7-6.3-4.6L5.7 21 8 14 2 9.4h7.6z"/></svg><span>Skills 中心</span></a>

      <div class="nav-group-label">智能</div>
      <a class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3a4 4 0 0 1 4 4v1a4 4 0 0 1 0 8v1a4 4 0 0 1-8 0v-1a4 4 0 0 1 0-8V7a4 4 0 0 1 4-4z"/></svg><span>Copilot 助手</span></a>
      <a class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20v-6M12 8V4M6 12H4m16 0h-2"/><circle cx="12" cy="11" r="3"/></svg><span>收藏</span></a>
    </div>
    <div class="nav-foot">
      <div class="nav-foot-user">
        <div class="avatar" style="width:34px;height:34px;font-size:13px">陈</div>
        <div class="nav-foot-name">陈一鸣<small>产品设计部</small></div>
      </div>
    </div>
  </aside>

  <!-- ░░░░░░░░░░ 主区 ░░░░░░░░░░ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" onclick="toggleNav()" title="折叠导航">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="search">
        <svg class="icon s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="search" type="text" placeholder="搜索文档、项目、应用…" oninput="filterDocs(this.value)" />
        <kbd>⌘K</kbd>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" onclick="toggleTheme()" title="切换主题">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" onclick="toggleRight()" title="任务面板">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3 8-8M3 12l3 3 1-1"/></svg>
      </button>

    <div class="scroll">

<script>
/* ============================ 数据 ============================ */
const COVERS = [
  ['#eef4ff','#3b6cf6','📄'],['#e7f6ec','#16a34a','📊'],['#fdf0e3','#d97706','🗂️'],
  ['#fdeaea','#dc2626','📌'],['#f3eaff','#7c3aed','🎨'],['#e6f7fb','#0891b2','🧩']
];
// 关键区分：编辑维度 vs 访问维度
//  mine=我创建的, ts=我最近“编辑”的权重(仅我编辑过的有), edited=上次编辑文案
//  acc=我最近“访问/打开”的权重(只要我打开过就有,含只读浏览), accessed=上次打开文案
//  fav=收藏, shared=别人分享给我的, ci=封面色
const DOCS = [
  {id:'d1', t:'手搭产品基座 · 设计规范 V2',d:'统一组件库、栅格与色彩 token,沉淀可复用的设计基座。',tag:'设计',who:'陈一鸣',c:'陈',type:'笔记',m:8, mine:true, fav:true, shared:false, edited:'2 小时前', ts:100, accessed:'2 小时前', acc:100, ci:4},
  {id:'d2', t:'API 接口文档 · 订单域',d:'订单中心对外接口定义、字段说明与示例。',tag:'研发',who:'吴昊',c:'吴',type:'文档',m:3, mine:false,fav:false,shared:true, edited:'今天 09:12', ts:0, accessed:'今天 09:40', acc:98, ci:5},
  {id:'d3', t:'2026 Q2 产品路线图',d:'季度目标拆解、关键里程碑与跨团队依赖梳理。',tag:'产品',who:'李航',c:'李',type:'看板',m:24,mine:false,fav:true, shared:false, edited:'今天 10:30', ts:0, accessed:'今天 11:05', acc:99, ci:1},
  {id:'d4', t:'首页 Redesign 走查记录',d:'高保真稿评审问题清单与处理状态跟踪。',tag:'设计',who:'陈一鸣',c:'陈',type:'文档',m:5, mine:true, fav:false,shared:false, edited:'昨天 19:40', ts:90, accessed:'今天 08:30', acc:96, ci:0},
  {id:'d5', t:'前端工程化最佳实践',d:'构建、规范、CI/CD 与性能优化的团队约定。',tag:'研发',who:'赵磊',c:'赵',type:'笔记',m:12,mine:false,fav:false,shared:false, edited:'2 天前', ts:0, accessed:'昨天 16:20', acc:80, ci:5},
  {id:'d6', t:'用户访谈纪要 · 4 月批次',d:'12 位目标用户深访结论,核心痛点与机会点汇总。',tag:'产品',who:'陈一鸣',c:'陈',type:'文档',m:6, mine:true, fav:false,shared:false, edited:'3 天前', ts:70, accessed:'3 天前', acc:70, ci:1},
  {id:'d7', t:'品牌视觉升级提案',d:'新 Logo、主色与插画系统的方向探索与对比。',tag:'设计',who:'周琳',c:'周',type:'看板',m:9, mine:false,fav:true, shared:true, edited:'4 天前', ts:0, accessed:'4 天前', acc:60, ci:4},
  {id:'d8', t:'组件库使用手册',d:'常用组件 API、用法示例与设计走查清单。',tag:'设计',who:'陈一鸣',c:'陈',type:'笔记',m:2, mine:true, fav:false,shared:false, edited:'5 天前', ts:55, accessed:'5 天前', acc:55, ci:0},
  {id:'d9', t:'增长实验复盘 #127',d:'本期 A/B 实验设计、数据表现与下一步策略。',tag:'运营',who:'孙婷',c:'孙',type:'文档',m:4, mine:false,fav:false,shared:true, edited:'昨天', ts:0, accessed:'昨天 14:10', acc:78, ci:2},
  {id:'d10',t:'稿件库 1000 篇精选',d:'高质量内容沉淀,按主题分类的可复用素材。',tag:'运营',who:'郑爽',c:'郑',type:'笔记',m:0, mine:false,fav:false,shared:false, edited:'上周', ts:0, accessed:'', acc:0, ci:3},
  {id:'d11',t:'竞品分析 · 协作工具横评',d:'主流协作/知识工具的功能、定价与差异化对比。',tag:'产品',who:'林夕',c:'林',type:'文档',m:7, mine:false,fav:false,shared:false, edited:'2 天前', ts:0, accessed:'', acc:0, ci:1},
  {id:'d12',t:'OKR 撰写与对齐指南',d:'目标设定方法、示例库与季度对齐流程。',tag:'运营',who:'何川',c:'何',type:'笔记',m:3, mine:false,fav:false,shared:false, edited:'3 天前', ts:0, accessed:'', acc:0, ci:2},
];
const TASKS = {
  task:[
    {s:'doing',sl:'进行中',id:'#3052',t:'完成首页 Redesign 高保真稿并走查',who:'陈',due:'今天 18:00',soon:true},
    {s:'todo', sl:'待开始',id:'#3091',t:'梳理知识库权限模型与角色矩阵',who:'李',due:'明天'},
    {s:'todo', sl:'待开始',id:'#3093',t:'接入 Copilot 文档摘要能力',who:'赵',due:'06-02'},
    {s:'doing',sl:'进行中',id:'#3085',t:'右侧任务面板交互联调',who:'吴',due:'06-03'},
    {s:'done', sl:'已完成',id:'#3060',t:'设计 token 收敛为单主色系统',who:'周',due:'已完成'},
    {s:'done', sl:'已完成',id:'#3041',t:'导航分组与折叠态实现',who:'孙',due:'已完成'},
  ],
  alert:[
    {s:'alert',sl:'告警',id:'#A12',t:'文档「订单域 API」7 天未更新,引用方 3 个',who:'吴',due:'需关注',soon:true},
    {s:'alert',sl:'告警',id:'#A09',t:'项目「品牌升级」里程碑已逾期 2 天',who:'周',due:'逾期',soon:true},
  ]
};

/* ============================ 渲染 ============================ */
const docsEl = document.getElementById('docs');
const pinnedEl = document.getElementById('pinned');
const resumeEl = document.getElementById('resume-row');
// 置顶集合（本地持久化）
let pinned = new Set(JSON.parse(localStorage.getItem('kw_pins')||'[]'));

function docCard(d){
  const c = COVERS[d.ci];
  const on = pinned.has(d.id) ? 'on' : '';
  return `<div class="doc" onclick="openDoc('${d.id}')">
    <div class="doc-cover" style="background:${c[0]}">
      <span class="glyph" style="color:${c[1]}">${c[2]}</span>
      <span class="doc-type">${d.type}</span>
      <button class="pin ${on}" title="置顶常用" onclick="togglePin('${d.id}',event)">📌</button>
    </div>
    <div class="doc-body">
      <div class="doc-title">${d.t}</div>
      <div class="doc-desc">${d.d}</div>
      <div class="doc-meta">
        <span class="who"><span class="avatar">${d.c}</span>${d.who}</span>
        <span class="m-r"><span>🕑 ${d.edited}</span><span>💬 ${d.m}</span></span>
      </div>
    </div></div>`;
}

// 继续编辑：我最近编辑过的 4 篇
function renderResume(){
  const mine = DOCS.filter(d=>d.mine).sort((a,b)=>b.ts-a.ts).slice(0,4);
  resumeEl.innerHTML = mine.map(d=>{
    const c = COVERS[d.ci];
    return `<div class="resume" onclick="openDoc('${d.id}')">
      <div class="r-ico" style="background:${c[0]};color:${c[1]}">${c[2]}</div>
      <div class="r-title">${d.t}</div>
      <div class="r-foot">上次编辑 · <b>${d.edited}</b></div>
      <div class="r-btn">✏️ 继续编辑</div>
    </div>`;
  }).join('');
}

// 置顶 / 常用：位置固定（按 DOCS 原序，稳定可预期）
function renderPinned(){
  const list = DOCS.filter(d=>pinned.has(d.id));
  document.getElementById('sec-pinned').style.display = list.length ? 'block' : 'none';
  document.getElementById('pin-count').textContent = list.length ? `${list.length} 篇 · 位置固定` : '';
  pinnedEl.innerHTML = list.map(docCard).join('');
}
function togglePin(id, ev){
  ev.stopPropagation();
  pinned.has(id) ? pinned.delete(id) : pinned.add(id);
  localStorage.setItem('kw_pins', JSON.stringify([...pinned]));
  renderPinned(); apply();
  showTip(pinned.has(id) ? '已置顶到「常用」' : '已取消置顶');
}
function openDoc(id){ const d = DOCS.find(x=>x.id===id); showTip('正在打开:'+d.t); }

function renderTasks(key){
  document.getElementById('right-list').innerHTML = TASKS[key].map(t=>`
    <div class="task">
      <div class="task-top">
        <span class="badge-status st-${t.s}"><span class="dot"></span>${t.sl}</span>
        <span class="task-id">${t.id}</span>
      </div>
      <div class="task-title">${t.t}</div>
      <div class="task-foot">
        <span class="avatar">${t.who}</span>负责人
        <span class="due ${t.soon?'soon':''}">🕑 ${t.due}</span>
      </div>
    </div>`).join('');
}
/* ============================ 交互 ============================ */
let curTab='access', curTag='全部', curSearch='';
const TAB_META = {
  // 最近访问 = 我打开过的一切(编辑+浏览),按访问时间排 —— 与“继续编辑(我编辑的)”语义不同
  access:{title:'最近访问', sub:'我打开过的全部(含只读浏览)', base:()=>DOCS.filter(d=>d.acc>0).sort((a,b)=>b.acc-a.acc)},
  mine:  {title:'我创建的', sub:'我作为作者的文档',           base:()=>DOCS.filter(d=>d.mine).sort((a,b)=>b.ts-a.ts)},
  fav:   {title:'收藏',     sub:'我标星的文档',               base:()=>DOCS.filter(d=>d.fav).sort((a,b)=>b.acc-a.acc)},
  shared:{title:'分享给我', sub:'同事分享 / @我 的文档',       base:()=>DOCS.filter(d=>d.shared&&!d.mine).sort((a,b)=>b.acc-a.acc)},
  reco:  {title:'推荐',     sub:'你可能想看,但还没打开过',     base:()=>DOCS.filter(d=>!d.mine&&!d.acc).sort((a,b)=>b.ts-a.ts)},
};
function apply(){
  const list = TAB_META[curTab].base()
    .filter(d=>(curTag==='全部'||d.tag===curTag) && (d.t+d.d).toLowerCase().includes(curSearch));
  document.getElementById('list-title').textContent = TAB_META[curTab].title;
  document.getElementById('list-count').textContent = `${list.length} 篇 · ${TAB_META[curTab].sub}`;
  if(!list.length){ docsEl.innerHTML=''; document.getElementById('empty').style.display='block'; }
  else { document.getElementById('empty').style.display='none'; docsEl.innerHTML = list.map(docCard).join(''); }
}
function filterDocs(v){ curSearch=v.toLowerCase().trim(); apply(); }
function filterTag(el){ document.querySelectorAll('#chips .chip').forEach(c=>c.classList.remove('active')); el.classList.add('active'); curTag=el.dataset.tag; apply(); }
function switchTab(el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active');
  curTab = el.dataset.tab;
  localStorage.setItem('kw_tab', curTab);   // 记住上次停留的 Tab
  apply();
}

/* ============================ 初始化 ============================ */
renderResume(); renderPinned(); renderTasks('task');
// 恢复上次停留的 Tab（默认「最近访问」，而非「推荐」；旧值失效时回落到默认）
(function restoreTab(){
  const saved = localStorage.getItem('kw_tab');
  const tabEl = (saved && document.querySelector(`.tab[data-tab="${saved}"]`)) || document.querySelector('.tab[data-tab="access"]');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tabEl.classList.add('active'); curTab=tabEl.dataset.tab;
  apply();
})();
function setView(v){ docsEl.className='docs '+v; document.getElementById('v-grid').classList.toggle('active',v==='grid'); document.getElementById('v-list').classList.toggle('active',v==='list'); }
function switchRight(el,k){ document.querySelectorAll('.right-tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); renderTasks(k); }
function toggleNav(){ document.getElementById('app').classList.toggle('nav-collapsed'); }
function toggleRight(){ document.getElementById('app').classList.toggle('right-hidden'); }
function toggleTheme(){ document.body.classList.toggle('dark'); showTip(document.body.classList.contains('dark')?'已切换到暗色主题':'已切换到亮色主题'); }
let tipT; function showTip(m){ const t=document.getElementById('tip'); t.textContent=m; t.classList.add('show'); clearTimeout(tipT); tipT=setTimeout(()=>t.classList.remove('show'),1600); }
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='k'){ e.preventDefault(); document.getElementById('search').focus(); }});
</script>
