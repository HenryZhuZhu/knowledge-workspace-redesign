<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>知识工作台 · Redesign Demo</title>
<style>
  /* ============================================================
     设计系统 —— 克制靛蓝 + 冷调石板灰 + 低饱和语义色
     发丝边框 / 极轻阴影 / Light · Dark 双主题
  ============================================================ */
  :root {
    --brand-50:#eef1fb; --brand-100:#dfe4f7; --brand-300:#a8b3ea;
    --brand-500:#4f5fd0; --brand-600:#4250bb; --brand-700:#37439c;
    --gray-0:#ffffff; --gray-25:#fbfcfd; --gray-50:#f7f8fa; --gray-100:#eff1f4;
    --gray-200:#e6e8ed; --gray-300:#d4d8e0; --gray-400:#a2a9b5;
    --gray-500:#6b7280; --gray-600:#4d545f; --gray-700:#363b45;
    --gray-800:#22262e; --gray-900:#14171c;
    --success:#2f9e6e; --success-bg:#e9f5ef;
    --warning:#bf841e; --warning-bg:#f7f0e1;
    --danger:#d25a5a;  --danger-bg:#f8e9e9;
    --info:#4f5fd0;    --info-bg:#eef1fb;
    --bg:var(--gray-50); --surface:var(--gray-0); --surface-2:var(--gray-100); --border:var(--gray-200);
    --text:var(--gray-800); --text-soft:var(--gray-500); --text-mute:var(--gray-400);
    --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:25px;
    --r-sm:7px; --r-md:10px; --r-lg:14px; --r-xl:20px;
    --shadow-xs:0 1px 2px rgba(20,23,28,.04);
    --shadow-sm:0 1px 3px rgba(20,23,28,.06),0 1px 2px rgba(20,23,28,.04);
    --shadow-md:0 6px 16px rgba(20,23,28,.08);
    --nav-w:238px; --nav-w-collapsed:68px; --right-w:330px;
  }
  body.dark {
    --gray-0:#16181d; --gray-25:#15171c; --gray-50:#0e1014; --gray-100:#1c1f26;
    --gray-200:#262a31; --gray-300:#363b44; --gray-400:#747b87;
    --gray-500:#919aa6; --gray-600:#b6bcc6; --gray-700:#d3d7dd; --gray-800:#e7e9ed; --gray-900:#f3f4f6;
    --brand-50:#1a2036; --brand-100:#222a47; --brand-300:#6f7be0;
    --brand-500:#5a6ad8; --brand-600:#6f7be0; --brand-700:#8893e6;
    --success:#3fb380; --success-bg:#15271f;
    --warning:#d29a3a; --warning-bg:#2a2114;
    --danger:#e07070;  --danger-bg:#2c1818;
    --info:#6f7be0;    --info-bg:#1a2036;
    --bg:#0e1014; --surface:#16181d; --surface-2:#1c1f26; --border:#262a31;
    --text:#e7e9ed; --text-soft:#919aa6; --text-mute:#747b87;
    --shadow-md:0 8px 22px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:var(--fs-base);
    -webkit-font-smoothing:antialiased; line-height:1.5; transition:background .25s,color .25s;
  }
  ::selection { background:var(--brand-100); }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--gray-300); border-radius:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  .icon { width:18px; height:18px; stroke-width:1.7; flex:none; }

  /* ============================ 布局骨架 */
  .app { display:grid; grid-template-columns:var(--nav-w) 1fr var(--right-w); height:100vh; transition:grid-template-columns .25s ease; }
  .app.nav-collapsed { grid-template-columns:var(--nav-w-collapsed) 1fr var(--right-w); }
  .app.right-hidden  { grid-template-columns:var(--nav-w) 1fr 0; }
  .app.nav-collapsed.right-hidden { grid-template-columns:var(--nav-w-collapsed) 1fr 0; }
  /* 二级/三级页自动隐藏右侧任务面板 */
  .app.right-auto-hidden { grid-template-columns:var(--nav-w) 1fr 0; }
  .app.nav-collapsed.right-auto-hidden { grid-template-columns:var(--nav-w-collapsed) 1fr 0; }

  /* ============================ 左侧导航 */
  .nav { background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .nav-top { display:flex; align-items:center; gap:10px; padding:18px 16px 14px; }
  .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--brand-500),var(--brand-700)); display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px; flex:none; }
  .logo-text { font-weight:650; font-size:var(--fs-lg); white-space:nowrap; letter-spacing:-.01em; }
  .nav-collapsed .logo-text, .nav-collapsed .nav-group-label, .nav-collapsed .nav-item span, .nav-collapsed .nav-foot-name { display:none; }
  .nav-scroll { flex:1; overflow-y:auto; padding:6px 12px; }
  .nav-group-label { font-size:var(--fs-xs); color:var(--text-mute); font-weight:600; letter-spacing:.06em; padding:16px 10px 6px; text-transform:uppercase; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:var(--r-sm); color:var(--text-soft); font-size:var(--fs-md); font-weight:500; white-space:nowrap; position:relative; transition:.15s; cursor:pointer; }
  .nav-item:hover { background:var(--surface-2); color:var(--text); }
  .nav-item.active { background:var(--brand-50); color:var(--brand-600); font-weight:600; }
  .nav-item.active::before { content:""; position:absolute; left:-12px; top:50%; transform:translateY(-50%); width:3px; height:18px; border-radius:0 3px 3px 0; background:var(--brand-500); }
  .nav-collapsed .nav-item { justify-content:center; padding:9px 0; }
  .nav-foot { border-top:1px solid var(--border); padding:10px 12px; }
  .nav-foot-user { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:var(--r-sm); cursor:pointer; }
  .nav-foot-user:hover { background:var(--surface-2); }
  .avatar { border-radius:50%; background:var(--brand-100); color:var(--brand-600); display:grid; place-items:center; font-weight:600; flex:none; width:24px; height:24px; font-size:11px; }
  .nav-foot-name { font-size:var(--fs-md); font-weight:600; white-space:nowrap; }
  .nav-foot-name small { display:block; color:var(--text-mute); font-weight:400; font-size:var(--fs-xs); }

  /* ============================ 主区 */
  .main { display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }
  .topbar { display:flex; align-items:center; gap:12px; padding:13px 26px; background:var(--surface); border-bottom:1px solid var(--border); }
  .icon-btn { width:34px; height:34px; border-radius:var(--r-sm); display:grid; place-items:center; color:var(--text-soft); transition:.15s; }
  .icon-btn:hover { background:var(--surface-2); color:var(--text); }
  .search { flex:1; max-width:460px; position:relative; }
  .search input { width:100%; height:38px; border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface-2); padding:0 14px 0 40px; font-size:var(--fs-base); color:var(--text); transition:.15s; }
  .search input:focus { outline:none; border-color:var(--brand-300); background:var(--surface); box-shadow:0 0 0 3px var(--brand-50); }
  .search .s-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-mute); }
  .search kbd { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:var(--fs-xs); color:var(--text-mute); background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-family:inherit; }
  .spacer { flex:1; }
  .btn-primary { display:flex; align-items:center; gap:7px; height:38px; padding:0 15px; border-radius:var(--r-md); background:var(--brand-500); color:#fff; font-weight:600; font-size:var(--fs-md); box-shadow:var(--shadow-xs); transition:.15s; }
  .btn-primary:hover { background:var(--brand-600); }
  .scroll { flex:1; overflow-y:auto; padding:24px 26px 40px; }

  .page { display:none; }
  .page.active { display:block; animation:fade .22s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  .page-head { margin-bottom:20px; }
  .page-head h1 { font-size:var(--fs-2xl); font-weight:700; letter-spacing:-.02em; }
  .page-head p { color:var(--text-soft); font-size:var(--fs-md); margin-top:5px; }

  .hello { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .hello h1 { font-size:var(--fs-2xl); font-weight:700; letter-spacing:-.02em; }
  .hello p { color:var(--text-soft); font-size:var(--fs-md); margin-top:5px; }
  .stat-row { display:flex; gap:8px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:9px 15px; min-width:86px; cursor:pointer; transition:.15s; }
  .stat:hover { border-color:var(--brand-300); box-shadow:var(--shadow-xs); }
  .stat b { font-size:var(--fs-lg); font-weight:700; letter-spacing:-.01em; }
  .stat span { display:block; font-size:var(--fs-xs); color:var(--text-mute); margin-top:1px; }

  .sec { margin-bottom:28px; }
  .sec-head { display:flex; align-items:center; gap:10px; margin:0 0 15px; flex-wrap:wrap; }
  .sec-head h2 { font-size:var(--fs-lg); font-weight:650; display:flex; align-items:center; gap:8px; letter-spacing:-.01em; }
  .sec-head .count { font-size:var(--fs-sm); color:var(--text-mute); }
  .sec-head .more { margin-left:auto; font-size:var(--fs-sm); color:var(--brand-600); font-weight:600; cursor:pointer; }
  .sec-head .more:hover { opacity:.75; }

  /* 项目卡 */
  .projs { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(256px,1fr)); }
  .proj { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:17px; transition:.18s; cursor:pointer; display:flex; flex-direction:column; gap:13px; }
  .proj:hover { border-color:var(--brand-300); box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .proj-top { display:flex; align-items:center; gap:12px; }
  .proj-ico { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:19px; flex:none; }
  .proj-top b { font-size:var(--fs-base); font-weight:650; display:block; line-height:1.3; }
  .proj-top small { font-size:var(--fs-xs); color:var(--text-mute); }
  .proj-dirs { display:flex; flex-wrap:wrap; gap:6px; }
  .dir-chip { font-size:var(--fs-xs); color:var(--text-soft); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:2px 8px; display:flex; align-items:center; gap:4px; }
  .proj-bar { height:5px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .proj-bar i { display:block; height:100%; border-radius:5px; }
  .proj-foot { display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:2px; }
  .members { display:flex; }
  .members .avatar { width:23px; height:23px; font-size:10px; border:2px solid var(--surface); margin-left:-7px; }
  .members .avatar:first-child { margin-left:0; }
  .proj-updated { margin-left:auto; font-size:var(--fs-xs); color:var(--text-mute); }

  /* 工具条 */
  .toolbar { display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs { display:flex; gap:3px; background:var(--surface-2); padding:3px; border-radius:var(--r-md); }
  .tab { padding:6px 15px; border-radius:7px; font-size:var(--fs-md); font-weight:600; color:var(--text-soft); transition:.15s; }
  .tab.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-xs); }
  .chips { display:flex; gap:7px; flex-wrap:wrap; }
  .chip { padding:5px 12px; border:1px solid var(--border); border-radius:99px; font-size:var(--fs-sm); color:var(--text-soft); background:var(--surface); transition:.15s; display:flex; align-items:center; gap:5px; }
  .chip:hover { border-color:var(--brand-300); color:var(--brand-600); }
  .chip.active { background:var(--brand-500); border-color:var(--brand-500); color:#fff; }
  .view-toggle { margin-left:auto; display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:8px; }
  .view-toggle button { width:30px; height:28px; border-radius:6px; display:grid; place-items:center; color:var(--text-soft); }
  .view-toggle button.active { background:var(--surface); color:var(--brand-600); box-shadow:var(--shadow-xs); }

  /* 文档卡 */
  .docs { display:grid; gap:14px; }
  .docs.grid { grid-template-columns:repeat(auto-fill,minmax(234px,1fr)); }
  .docs.list { grid-template-columns:1fr; }
  .doc { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; transition:.18s; cursor:pointer; display:flex; flex-direction:column; }
  .doc:hover { border-color:var(--brand-300); box-shadow:var(--shadow-md); transform:translateY(-3px); }
  .doc-cover { height:96px; position:relative; display:grid; place-items:center; overflow:hidden; }
  .doc-cover .glyph { font-size:26px; opacity:.85; }
  .doc-type { position:absolute; top:10px; left:10px; font-size:var(--fs-xs); font-weight:600; padding:2px 9px; border-radius:99px; background:var(--surface); color:var(--text-soft); border:1px solid var(--border); }
  .doc-cover .pin { position:absolute; top:8px; right:8px; width:27px; height:27px; border-radius:7px; background:var(--surface); display:grid; place-items:center; color:var(--text-mute); opacity:0; transition:.15s; border:1px solid var(--border); }
  .doc:hover .pin { opacity:1; }
  .doc-cover .pin:hover { color:var(--warning); }
  .doc-cover .pin.on { opacity:1; color:var(--warning); background:var(--warning-bg); border-color:transparent; }
  .doc-body { padding:13px 14px; flex:1; display:flex; flex-direction:column; gap:6px; }
  .doc-crumb { font-size:var(--fs-xs); color:var(--text-soft); display:flex; align-items:center; gap:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .doc-crumb b { color:var(--brand-600); font-weight:600; }
  .doc-title { font-size:var(--fs-base); font-weight:600; line-height:1.4; letter-spacing:-.01em; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .doc-desc { font-size:var(--fs-sm); color:var(--text-soft); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .doc-meta { display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:5px; font-size:var(--fs-xs); color:var(--text-mute); }
  .doc-meta .who { display:flex; align-items:center; gap:6px; }
  .doc-meta .who .avatar { width:20px; height:20px; font-size:10px; }
  .doc-meta .m-r { margin-left:auto; display:flex; gap:10px; }
  .doc-meta .m-r span { display:flex; align-items:center; gap:3px; }
  .docs.list .doc { flex-direction:row; align-items:stretch; }
  .docs.list .doc-cover { width:116px; height:auto; flex:none; }
  .docs.list .doc-desc { -webkit-line-clamp:1; line-clamp:1; }
  .sec-pinned .doc { border-color:var(--brand-100); }

  .empty { text-align:center; padding:48px 0; color:var(--text-mute); }
  .empty .glyph { font-size:38px; opacity:.5; }
  .empty p { margin-top:10px; font-size:var(--fs-md); }

  /* 项目详情：目录树 + 笔记 */
  .detail-head { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .detail-back { display:flex; align-items:center; gap:5px; font-size:var(--fs-md); font-weight:600; color:var(--text-soft); padding:7px 12px; border:1px solid var(--border); border-radius:var(--r-sm); transition:.15s; }
  .detail-back:hover { color:var(--text); border-color:var(--brand-300); }
  .detail-title { display:flex; align-items:center; gap:12px; }
  .detail-title .d-ico { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:20px; flex:none; }
  .detail-title h1 { font-size:var(--fs-xl); font-weight:700; letter-spacing:-.01em; }
  .detail-title .d-meta { font-size:var(--fs-xs); color:var(--text-mute); }
  .detail-body { display:grid; grid-template-columns:248px 1fr; gap:22px; align-items:start; }
  .tree { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:8px; }
  .tree-row { display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:var(--r-sm); font-size:var(--fs-md); color:var(--text-soft); cursor:pointer; transition:.12s; user-select:none; }
  .tree-row:hover { background:var(--surface-2); color:var(--text); }
  .tree-row.active { background:var(--brand-50); color:var(--brand-600); font-weight:600; }
  .tree-row .caret { width:15px; text-align:center; font-size:9px; color:var(--text-mute); flex:none; transition:transform .15s; }
  .tree-row .caret.open { transform:rotate(90deg); }
  .tree-row .caret.blank { visibility:hidden; }
  .tree-row .tname { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tree-row .tcnt { font-size:var(--fs-xs); color:var(--text-mute); background:var(--surface-2); border-radius:99px; padding:0 7px; min-width:18px; text-align:center; }
  .tree-row.active .tcnt { background:var(--brand-100); color:var(--brand-600); }
  .detail-notes-head { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
  .detail-notes-head h2 { font-size:var(--fs-lg); font-weight:650; }

  /* ============================ 右侧栏：任务 / 告警（多应用来源） */
  .right { background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .right-head { display:flex; gap:4px; padding:16px 16px 10px; }
  .right-tab { flex:1; padding:8px; border-radius:8px; font-size:var(--fs-md); font-weight:600; color:var(--text-soft); display:flex; align-items:center; justify-content:center; gap:6px; transition:.15s; }
  .right-tab .cnt { font-size:10px; background:var(--surface-2); color:var(--text-soft); border-radius:99px; padding:0 6px; height:16px; display:grid; place-items:center; }
  .right-tab.active { background:var(--brand-50); color:var(--brand-600); }
  .right-tab.active .cnt { background:var(--brand-500); color:#fff; }
  .right-filter { display:flex; gap:6px; overflow-x:auto; padding:2px 16px 12px; border-bottom:1px solid var(--border); }
  .right-filter::-webkit-scrollbar { height:0; }
  .schip { white-space:nowrap; font-size:var(--fs-xs); font-weight:600; color:var(--text-soft); background:var(--surface-2); border:1px solid var(--border); border-radius:99px; padding:4px 10px; transition:.15s; flex:none; }
  .schip:hover { color:var(--text); border-color:var(--brand-300); }
  .schip.active { background:var(--brand-500); border-color:var(--brand-500); color:#fff; }
  .right-scroll { flex:1; overflow-y:auto; padding:4px 14px 18px; }
  .grp-head { display:flex; align-items:center; gap:8px; padding:15px 2px 9px; font-size:var(--fs-xs); font-weight:700; color:var(--text-mute); letter-spacing:.05em; }
  .grp-head i { font-style:normal; background:var(--surface-2); color:var(--text-soft); border-radius:99px; padding:0 7px; min-width:18px; height:16px; display:grid; place-items:center; font-size:10px; }
  .grp-head::after { content:""; flex:1; height:1px; background:var(--border); }
  .task { border:1px solid var(--border); border-radius:var(--r-md); padding:12px 13px; margin-bottom:9px; transition:.15s; cursor:pointer; background:var(--surface); }
  .task:hover { border-color:var(--brand-300); box-shadow:var(--shadow-sm); }
  .task-top { display:flex; align-items:center; gap:7px; margin-bottom:8px; }
  .badge-status { font-size:var(--fs-xs); font-weight:600; padding:2px 8px; border-radius:99px; display:inline-flex; align-items:center; gap:5px; }
  .badge-status .dot { width:6px; height:6px; border-radius:50%; }
  .st-todo  { background:var(--info-bg); color:var(--info); }       .st-todo .dot{background:var(--info);}
  .st-doing { background:var(--warning-bg); color:var(--warning); } .st-doing .dot{background:var(--warning);}
  .st-done  { background:var(--success-bg); color:var(--success); } .st-done .dot{background:var(--success);}
  .st-alert { background:var(--danger-bg); color:var(--danger); }   .st-alert .dot{background:var(--danger);}
  .src-badge { font-size:10px; font-weight:600; color:var(--text-soft); background:var(--surface-2); border:1px solid var(--border); border-radius:5px; padding:1px 6px; display:inline-flex; align-items:center; gap:3px; }
  .task-id { margin-left:auto; font-size:var(--fs-xs); color:var(--text-mute); font-variant-numeric:tabular-nums; }
  .task-title { font-size:var(--fs-md); font-weight:600; line-height:1.45; margin-bottom:9px; }
  .task-foot { display:flex; align-items:center; gap:8px; font-size:var(--fs-xs); color:var(--text-mute); }
  .task-foot .avatar { width:22px; height:22px; font-size:10px; }
  .task-foot .due { margin-left:auto; display:flex; align-items:center; gap:4px; }
  .task-foot .due.soon { color:var(--danger); font-weight:600; }

    <div class="proj-bar"><i style="width:${p.pct}%;background:${p.col}"></i></div>
    <div class="proj-foot">
      <div class="members">${p.members.map(m=>`<span class="avatar">${m}</span>`).join('')}</div>
      <span class="proj-updated">更新 ${p.updated}</span>
    </div></div>`;
}
function renderPinned(){
  const list = DOCS.filter(d=>pinned.has(d.id));
  document.getElementById('sec-pinned').style.display = list.length?'block':'none';
  document.getElementById('pin-count').textContent = list.length?`${list.length} 篇 · 位置固定`:'';
  pinnedEl.innerHTML = list.map(docCard).join('');
}
function togglePin(id, ev){
  ev.stopPropagation();
  pinned.has(id)?pinned.delete(id):pinned.add(id);
  localStorage.setItem('kw_pins', JSON.stringify([...pinned]));
  renderPinned(); apply();
  showTip(pinned.has(id)?'已置顶到「常用」':'已取消置顶');
}
function renderProjects(){
  document.getElementById('proj-count').textContent = `${PROJECTS.length} 个 · 共 ${DOCS.length} 篇笔记`;
  document.getElementById('proj-home').innerHTML = PROJECTS.slice(0,4).map(projectCard).join('');
  document.getElementById('proj-all').innerHTML = PROJECTS.map(projectCard).join('');
}
function renderChips(){
  const chips = ['<button class="chip active" data-proj="all" onclick="filterProject(\'all\',this)">全部项目</button>']
    .concat(PROJECTS.map(p=>`<button class="chip" data-proj="${p.id}" onclick="filterProject('${p.id}',this)">${p.emoji} ${p.name}</button>`));
  document.getElementById('chips').innerHTML = chips.join('');
}
function renderDiscover(){
  document.getElementById('discover').innerHTML = DOCS.filter(d=>!d.mine&&!d.acc).map(docCard).join('');
}

/* —— 项目详情：可展开目录树 + 该项目笔记 —— */
let curProj=null, curDir=null, treeOpen=new Set();
const SEP='::';
function pathPrefix(docPath, nodePath){ return nodePath.every((s,i)=>docPath[i]===s); }
function countNotes(proj, nodePath){ return DOCS.filter(d=>d.project===proj && pathPrefix(d.path, nodePath)).length; }
function openProject(id){
  curProj=id; curDir=null; treeOpen=new Set();
  (function walk(nodes,parent){ nodes.forEach(n=>{ const path=[...parent,n.n]; if(n.c){ treeOpen.add(path.join(SEP)); walk(n.c,path); } }); })(TREE[id]||[],[]);
  go('detail'); renderDetail();
}
function renderDetail(){
  const p=PMAP[curProj], ico=document.getElementById('d-ico');
  ico.style.background=p.col+'22'; ico.style.color=p.col; ico.textContent=p.emoji;
  document.getElementById('d-name').textContent=p.name;
  document.getElementById('d-meta').textContent=`${countNotes(curProj,[])} 篇笔记 · ${p.dirs.length} 个目录 · ${p.members.length} 名成员`;
  renderTree(); renderDetailNotes();
}
function treeRows(nodes, parent, depth){
  let html='';
  nodes.forEach(n=>{
    const path=[...parent,n.n], key=path.join(SEP), hasC=n.c&&n.c.length, open=treeOpen.has(key);
    const active = curDir && curDir.join(SEP)===key ? 'active':'';
    html+=`<div class="tree-row ${active}" style="padding-left:${8+depth*15}px" onclick="selectDir('${key}')">
      <span class="caret ${hasC?(open?'open':''):'blank'}" ${hasC?`onclick="toggleDir('${key}',event)"`:''}>▶</span>
      <span>${hasC?(open?'📂':'📁'):'📄'}</span>
      <span class="tname">${n.n}</span>
      <span class="tcnt">${countNotes(curProj,path)}</span>
    </div>`;
    if(hasC&&open) html+=treeRows(n.c, path, depth+1);
  });
  return html;
}
function renderTree(){
  const root = !curDir ? 'active':'';
  let html=`<div class="tree-row ${root}" style="padding-left:8px" onclick="selectDir('')">
    <span class="caret blank">▶</span><span>🗂️</span><span class="tname">全部笔记</span><span class="tcnt">${countNotes(curProj,[])}</span></div>`;
  document.getElementById('detail-tree').innerHTML = html + treeRows(TREE[curProj]||[], [], 0);
}
function renderDetailNotes(){
  const list=DOCS.filter(d=>d.project===curProj && (!curDir||pathPrefix(d.path,curDir)));
  document.getElementById('detail-dir-title').textContent = curDir? curDir.join(' › ') : '全部笔记';
  document.getElementById('detail-dir-count').textContent = `${list.length} 篇`;
  const el=document.getElementById('detail-docs'), empty=document.getElementById('detail-empty');
  if(!list.length){ el.innerHTML=''; empty.style.display='block'; }
  else { empty.style.display='none'; el.innerHTML=list.map(docCard).join(''); }
}
function selectDir(key){ curDir = key ? key.split(SEP) : null; renderTree(); renderDetailNotes(); }
function toggleDir(key,ev){ ev.stopPropagation(); treeOpen.has(key)?treeOpen.delete(key):treeOpen.add(key); renderTree(); }

/* —— 右侧栏：来源分类 + 分组 —— */
let curRight='task', curSrc='all';
function itemCard(i){
  const isTask = curRight==='task';
  const cls = isTask ? 'st-'+i.s : alertBadge[i.level];
  const label = isTask ? i.sl : i.ll;
  const s = SOURCES[i.src];
  return `<div class="task">
    <div class="task-top">
      <span class="badge-status ${cls}"><span class="dot"></span>${label}</span>
      <span class="src-badge">${s.icon} ${s.name}</span>
      <span class="task-id">${i.id}</span>
    </div>
    <div class="task-title">${i.t}</div>
    <div class="task-foot"><span class="avatar">${i.who}</span>${isTask?'负责人':'相关人'}<span class="due ${i.soon?'soon':''}">🕑 ${i.due}</span></div>
  </div>`;
}
function renderRightFilter(){
  const items = FEED[curRight];
  const srcs = [...new Set(items.map(i=>i.src))];
  const chips = [`<button class="schip ${curSrc==='all'?'active':''}" onclick="filterSrc('all')">全部来源 ${items.length}</button>`]
    .concat(srcs.map(s=>{ const n=items.filter(i=>i.src===s).length;
      return `<button class="schip ${curSrc===s?'active':''}" onclick="filterSrc('${s}')">${SOURCES[s].icon} ${SOURCES[s].name} ${n}</button>`; }));
  document.getElementById('right-filter').innerHTML = chips.join('');
}
function renderRight(){
  const items = FEED[curRight].filter(i=>curSrc==='all'||i.src===curSrc);
  let html='';
  GROUPS[curRight].forEach(g=>{
    const gi = items.filter(i=>groupKey[curRight](i)===g.k);
    if(!gi.length) return;
    html += `<div class="grp-head"><span>${g.label}</span><i>${gi.length}</i></div>` + gi.map(itemCard).join('');
  });
  document.getElementById('right-list').innerHTML = html || `<div class="empty"><div class="glyph">✓</div><p>该来源暂无内容</p></div>`;
}
function switchRight(el,k){ document.querySelectorAll('.right-tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); curRight=k; curSrc='all'; renderRightFilter(); renderRight(); }
function filterSrc(s){ curSrc=s; renderRightFilter(); renderRight(); }

/* ============================ 交互 / 状态 ============================ */
let curTab='access', curProject='all', curSearch='';
const TAB_META = {
  access:{title:'最近访问', sub:'我打开过的全部(含只读浏览)', base:()=>DOCS.filter(d=>d.acc>0).sort((a,b)=>b.acc-a.acc)},
  reco:  {title:'推荐',     sub:'你可能想看,还没打开过',     base:()=>DOCS.filter(d=>!d.mine&&!d.acc)},
};
function apply(){
  const list = TAB_META[curTab].base().filter(d=>(curProject==='all'||d.project===curProject) && (d.t+d.d).toLowerCase().includes(curSearch));
  const projTxt = curProject==='all' ? TAB_META[curTab].sub : `项目「${PMAP[curProject].name}」下`;
  document.getElementById('list-title').textContent = TAB_META[curTab].title;
  document.getElementById('list-count').textContent = `${list.length} 篇 · ${projTxt}`;
  if(!list.length){ docsEl.innerHTML=''; document.getElementById('empty').style.display='block'; }
  else { document.getElementById('empty').style.display='none'; docsEl.innerHTML = list.map(docCard).join(''); }
}
function onSearch(v){ curSearch=v.toLowerCase().trim(); apply(); }
function filterProject(id){
  curProject = id;
  if(getComputedStyle(document.getElementById('page-home')).display==='none') go('home');
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('active', c.dataset.proj===id));
  apply();
  document.querySelector('#page-home .toolbar')?.scrollIntoView({behavior:'smooth', block:'start'});
  if(id!=='all') showTip('已筛选项目:'+PMAP[id].name);
}
function switchTab(el){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); curTab=el.dataset.tab; localStorage.setItem('kw_tab', curTab); apply(); }
function setView(v){ docsEl.className='docs '+v; document.getElementById('v-grid').classList.toggle('active',v==='grid'); document.getElementById('v-list').classList.toggle('active',v==='list'); }
function openDoc(id){ const d = DOCS.find(x=>x.id===id); showTip(`正在打开:${PMAP[d.project].name} / ${d.path.join(' / ')} / ${d.t}`); }
function go(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  const navKey = page==='detail' ? 'projects' : page;   // 详情页保持「项目」高亮
  document.querySelectorAll('.nav-item[data-page]').forEach(n=>n.classList.toggle('active', n.dataset.page===navKey));
  document.getElementById('app').classList.toggle('right-auto-hidden', page!=='home'); // 非首页隐藏任务面板
  document.querySelector('.scroll').scrollTop = 0;
}
function notImpl(name){ showTip(`「${name}」为导航占位,Demo 未实现`); }
function toggleNav(){ document.getElementById('app').classList.toggle('nav-collapsed'); }
function toggleRight(){ document.getElementById('app').classList.toggle('right-hidden'); }
function applyTheme(t){ document.body.classList.toggle('dark', t==='dark'); localStorage.setItem('kw_theme', t); }
function toggleTheme(){ const dark=!document.body.classList.contains('dark'); applyTheme(dark?'dark':'light'); showTip(dark?'已切换到 Dark 模式':'已切换到 Light 模式'); }
let tipT; function showTip(m){ const t=document.getElementById('tip'); t.textContent=m; t.classList.add('show'); clearTimeout(tipT); tipT=setTimeout(()=>t.classList.remove('show'),1700); }
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='k'){ e.preventDefault(); document.getElementById('search').focus(); }});

/* ============================ 初始化 ============================ */
applyTheme(localStorage.getItem('kw_theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
document.getElementById('cnt-task').textContent = FEED.task.length;
document.getElementById('cnt-alert').textContent = FEED.alert.length;
renderRightFilter(); renderRight(); renderPinned(); renderProjects(); renderChips(); renderDiscover();
(function restoreTab(){
  const saved = localStorage.getItem('kw_tab');
  const tabEl = (saved && document.querySelector(`.tab[data-tab="${saved}"]`)) || document.querySelector('.tab[data-tab="access"]');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tabEl.classList.add('active'); curTab=tabEl.dataset.tab; apply();
})();
</script>
</body>
</html>
